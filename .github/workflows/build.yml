name: Build

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - docs/**
      - LICENSE
      - report-worker/**
  workflow_dispatch:

# 同一个 PR 推新提交时取消旧构建，所以只有最新提交有 CI 结果。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            name: tolk-macos
          - os: windows-latest
            platform: windows/amd64
            name: tolk-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: go test ./...
      # 输入助手（Windows）：对真实窗口读选区、粘贴替换、还原剪贴板、摆放浮层。
      # 截图工作区（Windows）：预热、控件 DLL 缓存命中、开始后弹出选区。
      - name: Input Assist and the screenshot workspace against a real desktop (Windows)
        if: runner.os == 'Windows'
        env:
          TOLK_WIN_E2E: "1"
        run: go test -p 1 -count=1 -timeout 8m -v ./internal/winsel ./internal/screenshot # -p 1: both need the foreground
      - name: Build the native helper into the app (macOS)
        if: runner.os == 'macOS'
        working-directory: macos/helper
        run: |
          set -euo pipefail
          swift build -c release --arch arm64 --arch x86_64
          BIN="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/tolk-helper"
          mkdir -p ../../resources/darwin-universal
          cp "$BIN" ../../resources/darwin-universal/tolk-helper
          chmod +x ../../resources/darwin-universal/tolk-helper
      - name: Talk to the real helper (macOS)
        if: runner.os == 'macOS'
        env:
          TOLK_HELPER: ${{ github.workspace }}/resources/darwin-universal/tolk-helper
        run: go test -count=1 -run TestRealHelper -v ./internal/helper
      - run: bun run build -- -platform ${{ matrix.platform }}
      - name: The helper is inside the app (macOS)
        if: runner.os == 'macOS'
        run: |
          APP="$(find build -maxdepth 3 -name '*.app' -print -quit)"
          test -x "$(find "$APP" -name tolk-helper -type f -print -quit)"
      # 用真的 ISCC 编一遍安装器（中文语言文件、图标都在这一步出错），装包也放到 proto 里方便实测。
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $v = (Select-String -Path version.go -Pattern 'const Version = "(.+)"').Matches[0].Groups[1].Value
          $exe = (Resolve-Path build\windows-amd64\Tolk.exe).Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" "/DSourceExe=$exe" installer\setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        continue-on-error: true # the account's Actions artifact quota may be spent
        with:
          name: ${{ matrix.name }}
          path: build/
      # Release assets do not count against the artifact quota.
      - name: Publish to the proto prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view proto >/dev/null 2>&1 || gh release create proto --prerelease --title "Prototype builds" --notes "Latest prototype builds from CI."
          mkdir -p out
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            cp build/darwin-universal/*.dmg out/Tolk-macos.dmg
            # 发布工具（含 keygen），在自己的 Mac 上直接运行，不用装 Go
            GOOS=darwin GOARCH=arm64 go build -o out/tolk-release-macos-arm64 ./cmd/tolk-release
          else
            powershell.exe -NoProfile -Command "Compress-Archive -Path build/windows-amd64/Tolk.exe,build/windows-amd64/Tolk-core.exe,build/windows-amd64/icon.png -DestinationPath out/Tolk-windows.zip -Force"
            cp dist/Tolk-setup-windows_*.exe out/Tolk-setup-windows.exe
          fi
          gh release upload proto out/* --clobber
