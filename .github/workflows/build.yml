name: Build

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            name: tolk-macos
          - os: windows-latest
            platform: windows/amd64
            name: tolk-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: go test ./...
      - run: bun run build -- -platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: build/
