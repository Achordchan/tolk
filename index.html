<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tolk</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="toolbar card">
        <label class="pill"><span class="pill-label">源语言</span><select id="source" aria-label="源语言"></select></label>
        <button id="swap" class="icon" title="交换翻译方向" aria-label="交换翻译方向">
          <svg viewBox="0 0 24 24"><path d="M7 4 3 8l4 4M3 8h14M17 12l4 4-4 4M21 16H7"/></svg>
        </button>
        <label class="pill"><span class="pill-label">目标语言</span><select id="target" aria-label="目标语言"></select></label>
        <span class="spacer"></span>
        <label class="pill"><span class="pill-label">服务</span><span id="dot" class="dot"></span><select id="engine" aria-label="翻译服务"></select></label>
        <span class="divider"></span>
        <button id="theme" class="icon" title="切换界面主题" aria-label="切换界面主题">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button id="mini" class="icon" title="开启 Mini 模式" aria-label="Mini 模式">
          <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/></svg>
        </button>
        <button id="open-settings" class="icon" title="打开设置" aria-label="打开设置">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </header>

      <main class="panes">
        <section class="pane card">
          <div class="pane-head">
            <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h14"/></svg>
            <strong>原文</strong>
            <span class="spacer"></span>
            <span id="count" class="muted"></span>
            <button id="clear" class="icon small" title="清空" aria-label="清空">
              <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
          </div>
          <textarea id="input" placeholder="在这里输入或粘贴要翻译的文字…" spellcheck="false"></textarea>
        </section>
        <section class="pane card">
          <div class="pane-head">
            <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <strong>译文</strong>
            <span class="spacer"></span>
            <span id="status" class="muted"></span>
            <button id="copy" class="icon small" title="复制译文" aria-label="复制译文">
              <svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
            </button>
          </div>
          <div id="output" class="output" aria-live="polite"></div>
          <div id="empty" class="empty">
            <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <strong>等待翻译</strong>
            <span>在左侧输入文字，结果会显示在这里</span>
          </div>
        </section>
      </main>
      <div id="toast" class="toast" hidden></div>
    </div>

    <dialog id="settings">
      <form method="dialog" id="settings-form">
        <h2>设置</h2>
        <p id="settings-note" class="muted"></p>
        <label class="row">翻译服务
          <select id="s-engine"></select>
        </label>

        <fieldset>
          <legend>双击复制</legend>
          <label class="check"><input id="s-dc" type="checkbox" /> 连按两次复制（Cmd/Ctrl+C+C）翻译所选文字</label>
          <label class="row">时间窗口 <span class="inline"><input id="s-dc-ms" type="number" min="200" max="2000" step="50" /> 毫秒</span></label>
        </fieldset>

        <fieldset data-for="deepl">
          <legend>DeepL</legend>
          <label class="row">API Key <input id="s-deepl-key" type="password" autocomplete="off" /></label>
        </fieldset>

        <fieldset data-for="microsoft">
          <legend>微软翻译</legend>
          <p class="muted">默认免费，不用填。想用 Azure 官方接口再填下面两项。</p>
          <label class="row">Azure Key <input id="s-ms-key" type="password" autocomplete="off" /></label>
          <label class="row">区域 <input id="s-ms-region" placeholder="例如 eastasia" /></label>
        </fieldset>

        <fieldset data-for="openai_compat">
          <legend>AI 翻译</legend>
          <label class="row">厂家 <select id="s-vendor"></select></label>
          <label class="row">模型 URL <input id="s-base" placeholder="https://…/v1" /></label>
          <label class="row">模型名 <input id="s-model" /></label>
          <label class="row">API Key <input id="s-ai-key" type="password" autocomplete="off" /></label>
        </fieldset>

        <p id="settings-error" class="error" hidden></p>
        <div class="actions">
          <button type="button" id="s-cancel" class="ghost">取消</button>
          <button type="submit" id="s-save" class="primary">保存</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
