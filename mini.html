<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Before the first paint: the theme and text sizes from the last run
      // (src/look.ts keeps them), so the window opens in its own colours.
      (function () {
        try {
          var l = JSON.parse(localStorage.getItem("tolk.look") || "null");
          var r = document.documentElement;
          if (l && l.theme && l.theme !== "system") r.dataset.theme = l.theme;
          if (l && l.sourceFont) r.style.setProperty("--src-size", l.sourceFont + "px");
          if (l && l.targetFont) r.style.setProperty("--dst-size", l.targetFont + "px");
        } catch (e) {}
      })();
    </script>
    <title>Tolk Mini</title>
    <link rel="stylesheet" href="./src/style.css" />
    <link rel="stylesheet" href="./src/mini.css" />
  </head>
  <body class="mini">
    <div id="bubble" class="bubble">
      <div class="bar">
        <span id="meta" class="muted"></span>
        <span class="spacer"></span>
        <button id="to-main" class="icon small" title="在主窗口翻译" aria-label="在主窗口翻译">
          <svg viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4l-8 8"/><path d="M19 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4"/></svg>
        </button>
        <button id="copy" class="icon small" title="复制译文" aria-label="复制译文">
          <svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        </button>
      </div>
      <div id="body" class="mini-body"></div>
      <div id="foot" class="mini-foot muted"></div>
    </div>
    <script type="module" src="./src/mini.ts"></script>
  </body>
</html>
