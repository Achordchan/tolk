<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Before the first paint: the theme and text sizes from the last run
      // (src/look.ts keeps them), so the window opens in its own colours.
      (function () {
        try {
          var l = JSON.parse(localStorage.getItem("tolk.look") || "null");
          var r = document.documentElement;
          if (l && l.theme && l.theme !== "system") r.dataset.theme = l.theme;
          if (l && l.sourceFont) r.style.setProperty("--src-size", l.sourceFont + "px");
          if (l && l.targetFont) r.style.setProperty("--dst-size", l.targetFont + "px");
        } catch (e) {}
      })();
    </script>
    <title>Tolk 候选面板</title>
    <link rel="stylesheet" href="./src/style.css" />
    <link rel="stylesheet" href="./src/panel.css" />
  </head>
  <body class="panel">
    <div id="panel"></div>
    <script type="module" src="./src/panel.ts"></script>
  </body>
</html>
